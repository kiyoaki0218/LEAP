<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>LEAP 管理ダッシュボード</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase_config.js"></script>
  <script src="./words_data.js"></script>
  <style>
    body { font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif; }
    .pre-wrap { white-space: pre-wrap; word-break: break-word; }
    .admin-tab.is-active { background: #0f172a; color: #fff; border-color: #0f172a; }
    textarea, input, select { font-size: 14px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-slate-900 text-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-lg">🏫</span>
        <div class="min-w-0">
          <p class="text-sm font-extrabold tracking-tight">LEAP 管理ダッシュボード</p>
          <p class="text-[10px] text-slate-400">お知らせ・意見箱の管理</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span id="admin-user" class="hidden text-[10px] text-slate-300 max-w-[160px] truncate"></span>
        <a href="./index.html" class="text-[10px] font-bold text-slate-300 hover:text-white px-2 py-1.5 rounded-lg border border-white/20">公開サイト</a>
        <button type="button" id="admin-logout" class="hidden text-[10px] font-bold bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-lg transition cursor-pointer">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-4">

    <!-- ログイン -->
    <section id="admin-login" class="max-w-sm mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4 mt-6">
      <div class="text-center space-y-1">
        <p class="text-3xl">🔐</p>
        <h1 class="text-lg font-extrabold text-slate-900">管理者ログイン</h1>
        <p class="text-[11px] text-slate-400">Supabase Auth のメール＋パスワードでログインします。</p>
      </div>
      <form id="admin-login-form" class="space-y-3">
        <div>
          <label for="admin-email" class="block text-[11px] font-bold text-slate-500 mb-1">メールアドレス</label>
          <input id="admin-email" type="email" autocomplete="username" required class="w-full p-3 border border-slate-300 rounded-xl focus:outline-none focus:border-slate-800">
        </div>
        <div>
          <label for="admin-password" class="block text-[11px] font-bold text-slate-500 mb-1">パスワード</label>
          <input id="admin-password" type="password" autocomplete="current-password" required class="w-full p-3 border border-slate-300 rounded-xl focus:outline-none focus:border-slate-800">
        </div>
        <button type="submit" id="admin-login-btn" class="w-full py-3 bg-slate-900 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition cursor-pointer">ログイン</button>
      </form>
      <p id="admin-login-message" class="text-[11px] font-bold text-rose-600 hidden"></p>
      <p class="text-[10px] text-slate-400 leading-relaxed">
        管理者アカウントは Supabase の Authentication で作成し、<code class="bg-slate-100 px-1 rounded">admin_users</code> に追加した人だけがログインできます。
      </p>
    </section>

    <!-- 管理画面 -->
    <section id="admin-app" class="hidden space-y-4">
      <nav class="flex gap-1.5 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm">
        <button type="button" class="admin-tab is-active flex-1 py-2 text-xs font-bold rounded-lg border border-transparent transition cursor-pointer" data-admin-tab="announcements">📢 お知らせ</button>
        <button type="button" class="admin-tab flex-1 py-2 text-xs font-bold rounded-lg border border-transparent text-slate-600 hover:text-slate-900 transition cursor-pointer" data-admin-tab="feedback">📮 意見箱</button>
        <button type="button" class="admin-tab flex-1 py-2 text-xs font-bold rounded-lg border border-transparent text-slate-600 hover:text-slate-900 transition cursor-pointer" data-admin-tab="mock">🏫 模試管理</button>
      </nav>

      <p id="admin-global-message" class="hidden text-[11px] font-bold rounded-xl px-3 py-2"></p>

      <!-- お知らせ -->
      <div id="panel-announcements" class="space-y-4">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <h2 id="ann-form-title" class="text-sm font-extrabold text-slate-900">お知らせを作成</h2>
            <button type="button" id="ann-reset" class="hidden text-[10px] font-bold text-slate-500 hover:text-slate-800 cursor-pointer">新規作成に戻る</button>
          </div>
          <input type="hidden" id="ann-id">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
              <label for="ann-title" class="block text-[11px] font-bold text-slate-500 mb-1">タイトル（必須）</label>
              <input id="ann-title" maxlength="120" class="w-full p-2.5 border border-slate-300 rounded-xl" placeholder="例: 第2回 全国一斉模試を開催します">
            </div>
            <div>
              <label for="ann-level" class="block text-[11px] font-bold text-slate-500 mb-1">種別</label>
              <select id="ann-level" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white">
                <option value="info">通常（info）</option>
                <option value="warning">重要（warning）</option>
                <option value="success">キャンペーン（success）</option>
              </select>
            </div>
            <div class="flex items-end">
              <label class="flex items-center gap-2 text-[11px] font-bold text-slate-600 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full cursor-pointer">
                <input id="ann-pinned" type="checkbox" class="w-4 h-4">
                上部にピン留めする
              </label>
            </div>
            <div>
              <label for="ann-published" class="block text-[11px] font-bold text-slate-500 mb-1">公開日時（空 = 今すぐ）</label>
              <input id="ann-published" type="datetime-local" class="w-full p-2.5 border border-slate-300 rounded-xl">
            </div>
            <div>
              <label for="ann-expires" class="block text-[11px] font-bold text-slate-500 mb-1">掲載終了（空 = 無期限）</label>
              <input id="ann-expires" type="datetime-local" class="w-full p-2.5 border border-slate-300 rounded-xl">
            </div>
            <div class="sm:col-span-2">
              <label for="ann-body" class="block text-[11px] font-bold text-slate-500 mb-1">本文（必須・改行可）</label>
              <textarea id="ann-body" rows="5" maxlength="4000" class="w-full p-3 border border-slate-300 rounded-xl"></textarea>
            </div>
          </div>
          <div class="flex items-center justify-between gap-2">
            <p id="ann-message" class="text-[11px] font-bold text-rose-600"></p>
            <button type="button" id="ann-save" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition cursor-pointer">保存する</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-2">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-extrabold text-slate-900">公開中・下書き一覧</h2>
            <button type="button" id="ann-refresh" class="text-[10px] font-bold text-slate-500 hover:text-slate-800 cursor-pointer">🔄 更新</button>
          </div>
          <div id="ann-list" class="space-y-2"></div>
        </div>
      </div>

      <!-- 模試管理 -->
      <div id="panel-mock" class="hidden space-y-4">
        <!-- 模試作成・編集フォーム -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 id="mock-form-title" class="text-sm font-extrabold text-slate-900">新規模試の作成</h2>
              <p class="text-[10px] text-slate-400">全国模試の開催日時・出題単語・制限時間を設定して公開します。</p>
            </div>
            <button type="button" id="mock-reset" class="hidden text-[10px] font-bold text-slate-500 hover:text-slate-800 cursor-pointer">新規作成に戻る</button>
          </div>
          <input type="hidden" id="mock-id">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
              <label for="mock-title" class="block text-[11px] font-bold text-slate-500 mb-1">模試タイトル（必須）</label>
              <input id="mock-title" maxlength="120" class="w-full p-2.5 border border-slate-300 rounded-xl" placeholder="例: 第2回 全国一斉 LEAP 模試">
            </div>

            <div>
              <label for="mock-subject" class="block text-[11px] font-bold text-slate-500 mb-1">対象科目</label>
              <select id="mock-subject" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-xs">
                <option value="leap" selected>LEAP 英単語</option>
                <option value="kobun">古文単語</option>
              </select>
            </div>

            <div>
              <label for="mock-duration" class="block text-[11px] font-bold text-slate-500 mb-1">制限時間（分）</label>
              <select id="mock-duration" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-xs">
                <option value="900">15分 (900秒)</option>
                <option value="1200">20分 (1200秒)</option>
                <option value="1500" selected>25分 (1500秒・標準)</option>
                <option value="1800">30分 (1800秒)</option>
                <option value="2400">40分 (2400秒)</option>
              </select>
            </div>

            <div>
              <label for="mock-start" class="block text-[11px] font-bold text-slate-500 mb-1">開催開始日時（必須）</label>
              <input id="mock-start" type="datetime-local" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs">
            </div>

            <div>
              <label for="mock-end" class="block text-[11px] font-bold text-slate-500 mb-1">開催終了日時（必須）</label>
              <input id="mock-end" type="datetime-local" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs">
            </div>

            <div class="sm:col-span-2 bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold text-slate-700">出題単語の選定</span>
                <span id="mock-qcount-badge" class="text-[10px] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2 py-0.5 rounded-full">0 問選択中</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <div>
                  <label for="mock-preset-range" class="block text-[10px] text-slate-500 mb-0.5">出題範囲プリセット</label>
                  <select id="mock-preset-range" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-[11px]">
                    <option value="all">全範囲 (Part 1〜4 / ID 1〜2000)</option>
                    <option value="part1_2">Part 1〜2 基礎・標準 (ID 1〜1000)</option>
                    <option value="part3_4">Part 3〜4 発展・最難関 (ID 1001〜2000)</option>
                    <option value="part1">Part 1 (ID 1〜400)</option>
                    <option value="part2">Part 2 (ID 401〜1000)</option>
                    <option value="part3">Part 3 (ID 1001〜1400)</option>
                    <option value="part4">Part 4 (ID 1401〜2000)</option>
                  </select>
                </div>
                <div>
                  <label for="mock-preset-count" class="block text-[10px] text-slate-500 mb-0.5">問題数</label>
                  <select id="mock-preset-count" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-[11px]">
                    <option value="25">25問（短縮）</option>
                    <option value="50" selected>50問（標準模試）</option>
                    <option value="100">100問（本格実戦）</option>
                  </select>
                </div>
                <div class="flex items-end">
                  <button type="button" id="mock-generate-btn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white text-[11px] font-bold rounded-lg shadow-xs transition cursor-pointer">
                    🎲 単語を自動抽出
                  </button>
                </div>
              </div>
              <div>
                <label for="mock-qids" class="block text-[10px] text-slate-500 mb-0.5">出題単語ID（カンマ区切りまたは自動抽出結果）</label>
                <textarea id="mock-qids" rows="2" class="w-full p-2 border border-slate-300 rounded-lg text-xs font-mono" placeholder="例: 1, 14, 25, 42, ..."></textarea>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between gap-2 pt-1">
            <p id="mock-message" class="text-[11px] font-bold text-rose-600"></p>
            <button type="button" id="mock-save" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition cursor-pointer">模試を保存・公開する</button>
          </div>
        </div>

        <!-- 模試一覧 ＆ 過去模試結果集約 -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-sm font-extrabold text-slate-900">模試一覧 ＆ 過去成績アーカイブ</h2>
              <p class="text-[10px] text-slate-400">全国模試の開催状況・受験者数・成績集約（平均点・最高点・受験者一覧）</p>
            </div>
            <button type="button" id="mock-refresh" class="text-[10px] font-bold text-slate-500 hover:text-slate-800 cursor-pointer">🔄 更新</button>
          </div>
          <div id="mock-exams-list" class="space-y-3"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="admin-toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50"></div>

  <div id="admin-confirm" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
      <p id="admin-confirm-message" class="text-sm font-bold text-slate-800 whitespace-pre-line"></p>
      <div class="flex gap-2">
        <button type="button" id="admin-confirm-cancel" class="flex-1 py-2.5 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl cursor-pointer">キャンセル</button>
        <button type="button" id="admin-confirm-ok" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl cursor-pointer">OK</button>
      </div>
    </div>
  </div>

  <script src="./js/admin.js"></script>
</body>
</html>
